spring.application.name=fyag-obras
server.port=${SERVER_PORT:8082}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fyag_obras}
spring.datasource.username=${DB_USER:fyag}
spring.datasource.password=${DB_PASSWORD:fyag}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

api.security.token.secret=${JWT_SECRET}

app.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
app.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fyag_auditoria}
# Monto (CLP) sobre el cual solo Gerencia aprueba o rechaza presupuestos (HU-03)
app.presupuesto.umbral-aprobacion=${UMBRAL_APROBACION:5000000}