# ============================================================================
# Aplicación: sirve para definir el nombre lógico del microservicio y el puerto
# donde se expone la API REST.
# ============================================================================
# Nombre lógico del microservicio. Sirve para identificarlo en logs, métricas,
# registros en Eureka/Spring Cloud y trazas distribuidas.
spring.application.name=fyag-obras
# Puerto donde escucha el servidor embebido (Tomcat). Sirve para exponer la API
# REST; configurable por variable de entorno, por defecto 8082.
server.port=${SERVER_PORT:8082}

# ============================================================================
# Datasource PostgreSQL: sirve para configurar la conexión JDBC a la base de
# datos donde se persisten los datos de negocio de Obras.
# ============================================================================
# Sirve para definir la URL JDBC de conexión a PostgreSQL (host, puerto y base
# parametrizables por variables de entorno).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fyag_obras}
# Sirve para autenticar el usuario con el que la aplicación se conecta a PostgreSQL.
spring.datasource.username=${DB_USER:fyag}
# Sirve para autenticar la contraseña del usuario de base de datos (nunca
# hardcodear en producción: usar variables de entorno o un vault).
spring.datasource.password=${DB_PASSWORD:fyag_dev_password}
# Sirve para indicar a Spring qué driver JDBC usar al abrir conexiones con PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# JPA / Hibernate: sirve para controlar cómo Hibernate valida el esquema, cómo
# se registra el SQL y cómo se gestiona la sesión por petición.
# ============================================================================
# Sirve para que Hibernate solo VALIDE que las entidades coincidan con el esquema
# existente, sin crear ni alterar tablas (el esquema lo gestiona Flyway).
spring.jpa.hibernate.ddl-auto=validate
# Sirve para controlar si se imprimen las sentencias SQL en consola.
# false = no mostrar (recomendado en producción para no filtrar datos ni llenar logs).
spring.jpa.show-sql=false
# Sirve para formatear el SQL en varias líneas cuando sí se muestre en logs,
# facilitando su lectura durante el desarrollo.
spring.jpa.properties.hibernate.format_sql=true
# Sirve para cerrar la sesión de Hibernate al terminar cada petición HTTP.
# Evita fugas de conexiones y consultas perezosas inesperadas en APIs REST.
spring.jpa.open-in-view=false

# ============================================================================
# Flyway: sirve para versionar y aplicar automáticamente las migraciones de
# base de datos al arrancar la aplicación.
# ============================================================================
# Sirve para activar Flyway, que aplica los scripts de migración al arrancar,
# manteniendo el esquema versionado y reproducible.
spring.flyway.enabled=true
# Sirve para indicar dónde están los scripts de migración (V1__..., V2__...)
# dentro del classpath del proyecto.
spring.flyway.locations=classpath:db/migration

# ============================================================================
# Seguridad / JWT: sirve para definir la clave secreta con la que se firman y
# validan los tokens JWT de la API.
# ============================================================================
# Sirve como clave secreta para firmar y validar los tokens JWT emitidos y
# consumidos por la API. Es obligatorio (sin valor por defecto) para no arrancar
# con un secreto inseguro; debe definirse por variable de entorno.
api.security.token.secret=${JWT_SECRET:byFvC5P2KeycGNq8r85GV_zhZC58i5CIDFSvyOhb2vkcOSFeyLY_12yCjBWuvVXR}

# ============================================================================
# Control de intentos de login: sirve para proteger las cuentas contra ataques
# de fuerza bruta limitando intentos fallidos y aplicando bloqueos temporales.
# ============================================================================
# Sirve para definir cuántos intentos fallidos de login se permiten antes de
# bloquear temporalmente la cuenta.
app.login.max-intentos=${LOGIN_MAX_INTENTOS:5}
# Sirve para definir cuántos minutos dura el bloqueo de la cuenta una vez que
# se superaron los intentos fallidos máximos.
app.login.bloqueo-minutos=${LOGIN_BLOQUEO_MINUTOS:15}

# ============================================================================
# MongoDB (auditoría): sirve para conectar con MongoDB, donde se registran los
# eventos de auditoría y trazabilidad de las acciones del sistema.
# ============================================================================
# Sirve para definir la URI de conexión a MongoDB usada para la base de auditoría.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/fyag_auditoria}

# ============================================================================
# Reglas de negocio - Presupuestos: sirve para parametrizar los umbrales y
# criterios de aprobación definidos en las historias de usuario.
# ============================================================================
# Sirve para definir el monto (en CLP) a partir del cual un presupuesto solo
# puede ser aprobado o rechazado por el rol Gerencia (criterio de la HU-03).
# Por debajo de ese umbral, otros roles autorizados pueden resolverlo.
app.presupuesto.umbral-aprobacion=${UMBRAL_APROBACION:5000000}